[project]
name = "gopro-cloud-sync"
version = "0.1.0"
description = "Sync all your GoPro cloud media to local storage"
readme = "README.md"
authors = [
    { name = "sib", email = "lizardonthestorm@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
    "rich>=14.3.3",
]

[project.scripts]
gopro-sync = "gopro_cloud_sync.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
